wled_fx:

light:
  - platform: esp32_rmt_led_strip
    id: wled_fx_strip
    name: WLED FX Strip
    pin: ${pin1}
    num_leds: 60
    channel_colors: GRB
    chipset: ws2812
    effects:
      - wled_fx:
          name: WLED FX default
      - wled_fx:
          id: wled_fx_fire
          name: WLED FX fire
          effect: Fire 2012
          palette: Fire
          speed: 64
          intensity: 160
          custom2: 128
          update_interval: 25ms
      - wled_fx:
          name: WLED FX matrix
          effect: Plasma
          width: 10
          height: 6
          serpentine: true
          use_light_color: false
          custom1: 40
          custom3: 8
          check1: true
          check2: false
          check3: true
